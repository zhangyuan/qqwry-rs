name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QQWRY_DB: data/qqwry.dat

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings

    - name: Download qqwry.dat
      run: |
        mkdir -p data
        curl -fsSL --retry 3 -o data/qqwry.dat \
          https://github.com/metowolf/qqwry.dat/releases/latest/download/qqwry.dat
        ls -lh data/qqwry.dat

    - name: Unit tests
      run: cargo test --all-targets --locked

    - name: Integration tests (real database)
      run: cargo test --test lookup --locked -- --ignored

  build:
    name: Build release
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --release --locked

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: qqwry
        path: target/release/qqwry
        if-no-files-found: error
